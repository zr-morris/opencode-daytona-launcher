services:
  - type: web
    name: opencode-daytona-launcher
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DAYTONA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
